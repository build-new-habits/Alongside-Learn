<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alongside: Learn</title>
  <meta name="description" content="A study coach that checks in with you, keeps track of your assignments and revision, and is alongside you while you learn.">
  <meta name="theme-color" content="#3D3D8F">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Learn">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <main id="main">
    <div id="header-actions"></div>
    <h1>Alongside: Learn</h1>
    <details id="resources-details">
      <summary>Need to talk to someone?</summary>
      <div id="resources-root"></div>
    </details>
    <nav id="nav-actions" aria-label="Main navigation"></nav>
    <div id="checkin-root"></div>
  </main>
  <script type="module" src="js/app.js"></script>
  <script>
    // Explicit scope so Learn's service worker takes precedence over any
    // broader-scoped one on the same origin (see sw.js comments, 10 Aug 2026).
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js', { scope: './' }).catch(err => {
        console.error('Service worker registration failed:', err);
      });
    }
  </script>
</body>
</html>
